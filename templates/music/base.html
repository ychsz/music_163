<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{%block title%}网易云音乐信息网站{%endblock%}</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            font-family:"微软雅黑",sans-serif;
            background-color:#f0f0f0;
            color:#333
        }
        .nav{
            background-color:#c20c0c;
            height:55px;
            line-height:55px;
            padding:0 30px;
            color:white;
        }
        .nav a{
            color:white;
            text-decoration:none;
            margin-right:25px;
        }
        .nav a:hover{
            color:#ffd0d0
        }
        .nav-search{
            float:right;
        }
        .nav-search input[type="text"]{
            padding:5px 8px;
            width:180px;
            border:none;
            border-radius:3px;
            outline:none;
        }
        .nav-search label{
            margin:0 5px;
            font-size:14px;
        }
        .nav-search button{
            padding:5px 12px;
            background-color:white;
            color:#900;
            border:none;
            border-radius:3px;
            cursor:pointer;
        }
        .nav-search button:hover{
            background-color:#ffe6e6;
            color:black;
        }
        .main{
            width:1000px;
            margin:20px auto;
            background-color:white;
            padding:20px;
            min-height:500px;
        }
        .footer{
            text-align:center;
            padding:15px;
            color:#888;
            font-size:13px;
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="{%url 'music:song_list'%}">歌曲列表</a>
        <a href="{%url 'music:artist_list'%}">歌手列表</a>
        <form class="nav-search" action="{%url 'music:search'%}" method="get">
            <input type="text" name="keyword" placeholder="请输入关键词" value="{{keyword|default:''}}" required>
            <label><input type="radio" name="type" value="song" {%if search_type|default:'song' == 'song'%}checked{%endif%}>歌曲</label>
            <label><input type="radio" name="type" value="artist" {%if search_type|default:'song' == 'artist'%}checked{%endif%}>歌手</label>
            <button type="submit">搜索</button>
        </form>
    </div>
    <div class="main">
        {%block content%}
        {%endblock%}
    </div>
    <div class="footer">
        <p>网易云音乐信息网站 作者：袁晨皓 19924573320 yuanchenhao_sz</p>
    </div>
</body>
</html>
