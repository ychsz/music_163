{%extends 'music/base.html'%}
{%block title%}{{artist.artist_name}} - 歌手详情{%endblock%}
{%block content%}
<style>
    .artist-header{
        display:flex;
        margin-bottom:40px;
        padding-bottom:25px;
        border-bottom:1px solid #eee;
    }
    .artist-avatar{
        margin-right:35px;
    }
    .artist-avatar img{
        width:220px;
        height:220px;
        border-radius:8px;
        object-fit:cover;
    }
    .artist-info h2{
        margin-bottom:15px;
        color:#333;
    }
    .artist-brief{
        line-height:1.8;
        color:#555;
        margin:15px 0;
        white-space:pre-line;
    }
    .original-link{
        color:#666;
        text-decoration:none;
    }
    .original-link:hover{
        color: #900;
        text-decoration:none;
    }
    .song-section h3{
        margin-bottom:20px;
        color:#333;
    }
    .song-grid{
        display:grid;
        grid-template-columns:repeat(5,1fr);
        gap:20px;
    }
    .song-card{
        text-align:center;
        border:1px solid #eee;
        border-radius:6px;
        padding:15px 10px;
        transition:all 0.2s;
    }
    .song-card:hover{
        border-color:#c20c0c;
        transform:translateY(-2px);
    }
    .song-card img{
        width:120px;
        height:120px;
        border-radius:4px;
        object-fit:cover;
        margin-bottom:8px;
    }
    .song-card a{
        color:#333;
        text-decoration:none;
        font-size:14px;
    }
    .song-card a:hover{
        color:#c20c0c;
    }
</style>
<div class="artist-header">
    <div class="artist-avatar">
        <img src="{{artist.artist_pic}}" alt="{{artist.artist_name}}">
    </div>
    <div class="artist-info">
        <h2>{{artist.artist_name}}</h2>
        <div class="artist-brief">{{artist.brief_desc}}</div>
        <p>
            原站链接：
            <a href="{{artist.artist_url}}" target="_blank" class="original-link">{{artist.artist_url}}</a>
        </p>
    </div>
</div>
<div class="song-section">
    <h3>TA的歌曲</h3>
    <div class="song-grid">
        {%for song in songs %}
            <div class="song-card">
                <a href="{%url 'music:song_detail' song.song_id%}">
                    <img src="{{song.album_pic}}" alt="{{song.song_name}}">
                    <p>{{song.song_name}}</p>
                </a>
            </div>
        {%empty%}
            <p style="color:#999;grid-column:1/-1;text-align:center;">暂无该歌手的歌曲数据</p>
        {%endfor%}
    </div>
</div>
{%endblock%}
